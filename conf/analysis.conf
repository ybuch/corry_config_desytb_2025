[Corryvreckan]
detectors_file = "/tb_data/geo_id11_align_tel_it8.geo"
histogram_file = "test_blosc.root"
log_format = DEFAULT
#log_level = TRACE
#number_of_events = 10
#number_of_tracks = -1
purge_output_directory = false
number_of_tracks = 100000000

[EventLoaderEUDAQ2]
type = tlu
file_name = "/tb_data/run002094_tlu.raw"
adjust_event_times=[["TluRawDataEvent", -115us, +230us]]
veto_triggers = true
#skip_time = 100s

[EventLoaderEUDAQ2]
type = "Mimosa26"
file_name = "/tb_data/run002094_telescope.raw"
shift_triggers = 1
#skip_time = 100s

[EventLoaderMuPixTelescope]
buffer_depth = 250
reference_frequency = 125
ckdivend2 = 0
ckdivend = 0
nbits_tot = 9
nbits_timestamp = 16
use_both_timestamps = false
input_directory = "/tb_data"
input_file = "single_run_002094.blck"

[EventLoaderHDF5]
#buffer_depth=30000
name = "Monopix2_0"
filename = "/tb_data/run002094_20250412_101501_ext_trigger_scan_interpreted_converted.h5"
dataset_name = "Hits"
#sync_by_trigger = true
timestamp_shift = -3.5us

[ClusteringSpatial]
type = "Mimosa26"

[Clustering4D]
name = "mp10_4"

[Clustering4D]
name = "Monopix2_0"
time_cut_abs = 15us

# [Correlations]
# do_time_cut = true
# time_cut_abs = 345us
# correlation_vs_time = false
# time_binning = 25ns

[Tracking4D]
min_hits_on_track       = 7
timestamp_from          = "mp10_4"
spatial_cut_abs         = 150um, 150um
exclude_dut             = true
track_model             = "gbl"
time_cut_abs		    = 300us
momentum        		= 4.2GeV
unique_cluster_usage    = true
max_plot_chi2           = 10

[DUTAssociation]
spatial_cut_abs    	 = 100um, 100um
time_cut_abs         = 50us

[AnalysisEfficiency]
log_level      	 = INFO
chi2ndof_cut     = 3
fake_rate_histo_range = 1000

[AnalysisDUT]
chi2ndof_cut      	 = 3
n_time_bins          = 1000
time_binning         = 25ns
charge_histo_range = 10000

